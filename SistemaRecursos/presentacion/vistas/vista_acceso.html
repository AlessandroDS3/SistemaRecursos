{% extends "base.html" %}
{% from 'formularios.html' import csrf, campo %}
{% block contenido %}
  <section class="panel estrecho">
    <h1>Iniciar sesión</h1>
    <p>Ingresa con tu cuenta del sistema de préstamos.</p>
    {% if error %}
      <p class="error" role="alert">{{ error }}</p>
    {% endif %}
    <form method="post" class="formulario">
      {{ csrf() }}
      <label>
        Usuario
        <input name="usuario"
               value="{{ request.form.get('usuario', '') }}"
               autocomplete="username"
               maxlength="50"
               required
               autofocus>
      </label>
      <label>
        Contraseña
        <input name="clave"
               type="password"
               autocomplete="current-password"
               maxlength="256"
               required>
      </label>
      <button>Iniciar sesión</button>
    </form>
  </section>
{% endblock %}
