[tool.black]
line-length = 100
target-version = ['py310']
skip-string-normalization = true
extend-exclude = 'datos_locales|\.venv'

[tool.djlint]
profile = 'jinja'
indent = 2
max_line_length = 110
preserve_blank_lines = true

[tool.mypy]
python_version = '3.10'
files = [
    'dominio/gestion_prestamos/reserva.py',
    'servicios/servicio_reserva.py',
    'repositorio/repositorio_reserva_sql.py',
]
follow_imports = 'silent'
check_untyped_defs = true
warn_unused_ignores = true
